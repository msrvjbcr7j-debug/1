name: Deploy to GitHub Pages

# Pages is served from the gh-pages branch. This workflow mirrors the app
# branch to gh-pages on every push; GitHub's built-in "pages build and
# deployment" pipeline then publishes it.

on:
  push:
    branches: [claude/cassia-bintan-holiday-app-zvdn6k]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror branch to gh-pages
        run: git push --force origin HEAD:gh-pages
